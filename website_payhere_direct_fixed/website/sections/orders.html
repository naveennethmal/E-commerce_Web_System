<!-- Orders Section Partial Component -->
<section class="orders-section-partial" id="orders-section">
  <!-- Hero Card -->
  <div class="orders-hero-card">
    <div class="hero-title-area">
      <h1>My Order History 🛍️</h1>
      <p>Track your active food deliveries and past receipts</p>
    </div>
    <div style="width: 56px; height: 56px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #FF9E00;">
      <i class="fa-solid fa-receipt"></i>
    </div>
  </div>

  <!-- Category / Status Filter -->
  <div class="filter-tabs-row">
    <button class="tab-btn active" onclick="filterOrders('all', this)">All Orders</button>
    <button class="tab-btn" onclick="filterOrders('pending', this)">Pending</button>
    <button class="tab-btn" onclick="filterOrders('preparing', this)">Preparing</button>
    <button class="tab-btn" onclick="filterOrders('delivered', this)">Delivered</button>
    <button class="tab-btn" onclick="filterOrders('cancelled', this)">Cancelled</button>
  </div>

  <!-- Orders List Body Container -->
  <div id="orders-list-container">
    <div style="padding: 50px; text-align: center; color: #64748B;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 28px; color: var(--primary-red);"></i>
      <p style="margin-top: 12px; font-weight: 600;">Loading your order history...</p>
    </div>
  </div>
</section>
