<!-- Site Header Partial -->
<header class="site-header">
  <div class="header-container">
    <!-- Logo -->
    <a href="#home" class="brand-logo" onclick="router.navigateTo('home')">
      <div class="brand-icon-wrap">
        <svg class="brand-svg-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoBg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FF9E00" />
              <stop offset="50%" stop-color="#E85D04" />
              <stop offset="100%" stop-color="#DC2626" />
            </linearGradient>
            <linearGradient id="chefHatGrad" x1="0" y1="0" x2="0" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="100%" stop-color="#FFF3C4" />
            </linearGradient>
            <linearGradient id="boltGrad" x1="0" y1="0" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFEA00" />
              <stop offset="100%" stop-color="#FF9E00" />
            </linearGradient>
          </defs>
          <rect width="44" height="44" rx="13" fill="url(#logoBg)" />
          <rect x="0.5" y="0.5" width="43" height="43" rx="12.5" stroke="white" stroke-opacity="0.25" />
          <path
            d="M14.5 18C14.5 15.7909 16.2909 14 18.5 14C19.2483 14 19.9482 14.2057 20.5484 14.5638C21.4391 13.5939 22.7231 13 24 13C25.2769 13 26.5609 13.5939 27.4516 14.5638C28.0518 14.2057 28.7517 14 29.5 14C31.7091 14 33.5 15.7909 33.5 18C33.5 19.1245 33.0371 20.141 32.2909 20.8718C32.7423 21.6703 33 22.5839 33 23.5C33 25.433 31.433 27 29.5 27H18.5C16.567 27 15 25.433 15 23.5C15 22.5839 15.2577 21.6703 15.7091 20.8718C14.9629 20.141 14.5 19.1245 14.5 18Z"
            fill="url(#chefHatGrad)" />
          <path
            d="M16.5 27.5H31.5V30.5C31.5 31.6046 30.6046 32.5 29.5 32.5H18.5C17.3954 32.5 16.5 31.6046 16.5 30.5V27.5Z"
            fill="url(#chefHatGrad)" />
          <path d="M26 21L20.5 28.5H24.5L23 34L28.5 26.5H24.5L26 21Z" fill="url(#boltGrad)" />
        </svg>
      </div>
      <div class="brand-info">
        <div class="brand-name-row">
          <span class="brand-name-food">Food</span>
          <span class="brand-name-express">Express</span>
          <span class="brand-speed-tag"><i class="fa-solid fa-bolt"></i></span>
        </div>
        <span class="brand-slogan"><span class="slogan-pulse"></span> DELICIOUS &amp; FAST DELIVERY</span>
      </div>
    </a>

    <!-- Navigation Links -->
    <nav class="nav-menu">
      <a href="#home" class="nav-link active" data-route="home" onclick="router.navigateTo('home')">
        <span><i class="fa-solid fa-house"></i></span> Home
      </a>
      <a href="#menu" class="nav-link" data-route="menu" onclick="router.navigateTo('menu')">
        <span><i class="fa-solid fa-utensils"></i></span> Menu
      </a>
      <a href="#offers" class="nav-link" data-route="offers" onclick="router.navigateTo('offers')">
        <span><i class="fa-solid fa-tags"></i></span> Offers
      </a>
      <a href="#about" class="nav-link" data-route="about" onclick="router.navigateTo('about')">
        <span><i class="fa-solid fa-info-circle"></i></span> About
      </a>
      <a href="pages/contact.html" class="nav-link" data-route="contact">
        <span><i class="fa-solid fa-envelope"></i></span> Contact
      </a>
      <a href="#cart" class="nav-link" data-route="cart" onclick="router.navigateTo('cart')">
        <span><i class="fa-solid fa-cart-shopping"></i></span> Cart
      </a>
    </nav>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
      <input type="text" id="search-input" class="search-input" placeholder="Search for food..." />
    </div>

    <!-- Header Actions -->
    <div class="header-right-actions">
      <!-- Notification Bell Wrapper -->
      <div class="notif-dropdown-wrapper" style="position:relative;">
        <button class="icon-btn notif-btn" id="notif-toggle-btn" title="Notifications" onclick="event.stopPropagation(); if(window.NotificationSystem) window.NotificationSystem.toggle();">
          <span><i class="fa-solid fa-bell"></i></span>
          <span class="badge-count-red" id="notif-badge-count" style="display:none;">0</span>
        </button>

        <!-- Notifications Popover Card -->
        <div class="notif-popover-card" id="notif-popover-card" style="display:none; position:absolute; top:calc(100% + 12px); right:0; width:320px; background:#FFFFFF; border-radius:16px; box-shadow:0 12px 35px rgba(0,0,0,0.18); border:1px solid #E2E8F0; z-index:999; overflow:hidden;">
          <div style="padding:14px 18px; border-bottom:1px solid #F1F5F9; display:flex; align-items:center; justify-content:space-between; background:#FAFBFD;">
            <div style="display:flex; align-items:center; gap:8px;">
              <i class="fa-solid fa-bell" style="color:#EA3829; font-size:16px;"></i>
              <strong style="font-size:15px; color:#0F172A;">Notifications</strong>
              <span id="notif-header-count" style="background:#FFF0F0; color:#EF4444; font-size:11px; font-weight:700; padding:2px 8px; border-radius:9999px;">0</span>
            </div>
            <button id="clear-all-notifs" style="background:none; border:none; color:#64748B; font-size:12px; font-weight:600; cursor:pointer; padding:2px 6px; border-radius:6px;" onmouseover="this.style.color='#EF4444'" onmouseout="this.style.color='#64748B'">Clear all</button>
          </div>

          <!-- Notification List Container -->
          <div id="notif-list-container" style="max-height:340px; overflow-y:auto; padding:4px 0;">
            <div id="notif-empty-state" style="padding:30px 20px; text-align:center; color:#94A3B8;">
              <i class="fa-regular fa-bell-slash" style="font-size:32px; color:#CBD5E1; margin-bottom:8px; display:block;"></i>
              <span style="font-size:13px; font-weight:500;">No new notifications</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Profile Dropdown Wrapper -->
      <div class="profile-dropdown-wrapper" id="profile-dropdown-wrapper">
        <button class="profile-avatar-trigger" id="profile-trigger-btn" title="Naveen Nethmal">
          <div class="avatar-circle-purple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
          </div>
          <span class="dropdown-chevron-arrow"><i class="fa-solid fa-chevron-down"></i></span>
        </button>

        <!-- Profile Popover Card -->
        <div class="profile-popover-card" id="profile-popover-card">
          <div class="popover-top-arrow"></div>

          <!-- User Banner -->
          <div class="user-profile-banner">
            <div class="banner-avatar-wrap">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
              </svg>
            </div>
            <div class="banner-user-info">
              <h4 class="user-display-name">Naveen Nethmal</h4>
              <span class="user-display-email">naveen@gmail.com</span>
            </div>
          </div>

          <!-- Menu List -->
          <div class="popover-menu-list">
            <button class="popover-menu-item" onclick="handleProfileOption('My Profile')">
              <div class="menu-item-left">
                <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>My Profile</span>
              </div>
              <span class="item-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </button>

            <button class="popover-menu-item" onclick="handleProfileOption('My Orders')">
              <div class="menu-item-left">
                <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span>My Orders</span>
              </div>
              <span class="item-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </button>

            <button class="popover-menu-item" onclick="handleProfileOption('Favorites')">
              <div class="menu-item-left">
                <svg class="menu-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                  </path>
                </svg>
                <span>Favorites</span>
              </div>
              <span class="item-chevron"><i class="fa-solid fa-chevron-right"></i></span>
            </button>
          </div>

          <!-- Logout Button -->
          <button class="popover-logout-btn" onclick="handleProfileOption('Logout')">
            <svg class="logout-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
