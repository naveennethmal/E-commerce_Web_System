<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Register - FoodExpress</title>
  <meta name="description" content="Login or Create an account on FoodExpress to order delicious burgers, pizza, chicken, and desserts fast!" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

  <div class="login-page-wrapper">
    
    <!-- Left Hero & Branding Section -->
    <div class="left-brand-panel">
      <!-- Background Image & Gradient Overlay -->
      <img src="../images/login_bg.jpg" alt="Delicious Food Background" class="brand-bg-image" />
      <div class="brand-overlay"></div>

      <!-- Organic Wave & Graphic Accents -->
      <div class="accent-wave-top"></div>
      <div class="accent-wave-bottom"></div>

      <!-- Dot Matrices -->
      <div class="dot-grid-top">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="dot-grid-bottom">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <!-- Top Logo Bar -->
      <div class="panel-content-top">
        <div class="brand-logo-container" style="cursor: default;">
          <div class="brand-icon-box">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.43 4.38l-.7 7.62h2.54l.7-7.62C10.94 12.9 12 11.12 12 9V2h-1v7zm7-7v5h-2V2h-2v5.5c0 1.93 1.57 3.5 3.5 3.5s3.5-1.57 3.5-3.5V2h-3zM18 21h-2v-9h2v9z"/>
            </svg>
          </div>
          <div class="brand-text-wrap">
            <h1 class="brand-title">Food<span>Express</span></h1>
            <span class="brand-subtitle">Delicious food, delivered fast</span>
          </div>
        </div>
      </div>

      <!-- Middle Headline Content -->
      <div class="panel-content-middle">
        <h2 class="hero-headline">Good Food,<br /><span class="orange-text">Good Mood!</span></h2>
        <p class="hero-description">Login to continue and enjoy the best food experience.</p>
        <div class="accent-line-bar"></div>
      </div>

    </div>

    <!-- Right Authentication Form Card Panel -->
    <div class="right-form-panel">
      <div class="auth-card">

        <!-- Top Avatar Icon Header -->
        <div class="card-avatar-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>

        <div class="card-header-text">
          <h2 class="card-title" id="card-title">Welcome Back!</h2>
          <p class="card-subtitle" id="card-subtitle">Login to your account and continue</p>
        </div>

        <!-- Auth Form -->
        <form class="auth-form" id="auth-form" autocomplete="on">
          <input type="hidden" id="selected-role-input" name="role" value="customer" />

          <!-- Full Name Field (Register Mode Only) -->
          <div class="form-group" id="group-name" style="display: none;">
            <label class="form-label" for="name-input">Full Name</label>
            <div class="input-wrapper">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="name-input" class="input-control" placeholder="Enter your full name" />
            </div>
          </div>

          <!-- Contact Number Field (Register Mode Only) -->
          <div class="form-group" id="group-phone" style="display: none;">
            <label class="form-label" for="phone-input">Contact Number</label>
            <div class="input-wrapper">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
              <input type="tel" id="phone-input" class="input-control" placeholder="Enter your contact number" />
            </div>
          </div>

          <!-- Address Field (Register Mode Only) -->
          <div class="form-group" id="group-address" style="display: none;">
            <label class="form-label" for="address-input">Address</label>
            <div class="input-wrapper">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <input type="text" id="address-input" class="input-control" placeholder="Enter your delivery address" />
            </div>
          </div>

          <!-- Email Address Field -->
          <div class="form-group" id="group-email">
            <label class="form-label" for="email-input">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="email-input" class="input-control" placeholder="Enter your email" required />
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group" id="group-password">
            <label class="form-label" for="password-input">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="password-input" class="input-control" placeholder="Enter your password" required />
              <button type="button" class="btn-toggle-eye" id="toggle-password" title="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password Field (Register Mode Only) -->
          <div class="form-group" id="group-confirm-pass" style="display: none;">
            <label class="form-label" for="confirm-password-input">Confirm Password</label>
            <div class="input-wrapper">
              <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="confirm-password-input" class="input-control" placeholder="Confirm your password" />
              <button type="button" class="btn-toggle-eye" id="toggle-confirm-password" title="Toggle confirm password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Form Helpers: Remember Me -->
          <div class="form-helper-row" id="form-helper-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" checked />
              <span>Remember Me</span>
            </label>
          </div>

          <!-- Main Submit Button -->
          <button type="submit" class="btn-submit-primary" id="btn-submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span id="btn-submit-text">Login</span>
          </button>
        </form>

        <!-- Footer Below Card Link -->
        <div class="auth-footer-text">
          <span id="footer-prompt-text">Don't have an account?</span>
          <a href="#" id="toggle-auth-mode">Register Here</a>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript -->
  <script src="../js/login.js"></script>
</body>
</html>
